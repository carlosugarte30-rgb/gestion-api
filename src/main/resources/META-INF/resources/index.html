<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes - API REST</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
    h1 { color: #0056b3; }
    .container { display: flex; gap: 30px; flex-wrap: wrap; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 320px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #0056b3; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    button:hover { background-color: #003d80; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #0056b3; color: white; }
    tr:hover { background-color: #f1f1f1; }
  </style>
</head>
<body>

  <h1>🏥 Sistema de Gestión de Pacientes</h1>

  <div class="container">
    <!-- Formulario para agregar paciente -->
    <div class="card">
      <h3>Registrar Paciente</h3>
      <form id="pacienteForm">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido" required>
        </div>
        <div class="form-group">
          <label for="dni">DNI:</label>
          <input type="text" id="dni" required>
        </div>
        <div class="form-group">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" required>
        </div>
        <button type="submit">Guardar Paciente</button>
      </form>
    </div>

    <!-- Tabla para listar pacientes -->
    <div style="flex: 1; min-width: 300px;">
      <h3>Lista de Pacientes</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Edad</th>
          </tr>
        </thead>
        <tbody id="tablaPacientes">
          <!-- Datos cargados desde la API -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:8080/pacientes';

    async function cargarPacientes() {
      try {
        const res = await fetch(API_URL);
        const pacientes = await res.json();
        const tbody = document.getElementById('tablaPacientes');
        tbody.innerHTML = '';

        pacientes.forEach(p => {
          tbody.innerHTML += `
            <tr>
              <td>${p.id}</td>
              <td>${p.nombre}</td>
              <td>${p.apellido}</td>
              <td>${p.dni}</td>
              <td>${p.edad}</td>
            </tr>
          `;
        });
      } catch (error) {
        console.error('Error al cargar pacientes:', error);
      }
    }

    document.getElementById('pacienteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nuevoPaciente = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        dni: document.getElementById('dni').value,
        edad: parseInt(document.getElementById('edad').value)
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevoPaciente)
        });

        if (res.ok) {
          document.getElementById('pacienteForm').reset();
          cargarPacientes();
        }
      } catch (error) {
        console.error('Error al guardar paciente:', error);
      }
    });

    cargarPacientes();
  </script>

</body>
</html>
